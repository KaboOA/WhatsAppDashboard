      font-family: 'Syne', sans-serif;

      transition: opacity 0.2s;

    .section-divider {

    /* MAIN LAYOUT */
    #mainApp {

      height: 100vh;
      flex-direction: column;
    }

    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }

    .topbar h1 { font-size: 17px; font-weight: 800; flex: 1; }

      color: var(--green);

    }

    .dot {

      flex-shrink: 0;
    }

    .dot.live {

      animation: pulse 2s infinite;

    @keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: 0.4 } }

    .btn-topbar {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 5px 12px;
      border-radius: 6px;
      cursor: pointer;

    /* SIDEBAR */

      display: flex;

      font-size: 11px;

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.open { display: flex; }

    .modal {

      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 26px;
      width: 370px;

    .modal h3 { font-size: 15px; font-weight: 700; margin-bottom: 18px; }

    .modal-btns { display: flex; gap: 10px; margin-top: 18px; }

    .btn-cancel {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 9px;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'Syne', sans-serif;
      font-size: 13px;

    .btn-confirm {
      flex: 1;
      background: var(--green);
      border: none;
      color: #000;
      padding: 9px;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'Syne', sans-serif;
      font-size: 13px;
      font-weight: 700;

    /* TOAST */
    #toast {
      position: fixed;
      bottom: 22px;
      right: 22px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 11px 16px;
      border-radius: 10px;
      font-size: 13px;
      z-index: 999;
      opacity: 0;
      transform: translateY(8px);
      transition: all 0.3s;
      pointer-events: none;
    }

    #toast.show { opacity: 1; transform: translateY(0); }
    #toast.success { border-color: var(--green); }
    #toast.error { border-color: var(--red); }
  </style>

  <div id="toast"></div>

  <script>
    // ── STATE ──────────────────────────────────────────────────────────────────
    let supabaseClient = null;
    let config = {};
    let chats = {};        // keyed by contact_phone: { name, phone, messages:[], unread:0 }
    let activePhone = null;
    let realtimeChannel = null;
    let currentFilter = 'all';
    let searchQuery = '';

    // ── LOGIN ──────────────────────────────────────────────────────────────────
    function login() {
      const supabaseUrl = SUPABASE_URL;
      const supabaseKey = SUPABASE_KEY;
      const phoneId = document.getElementById('cfgPhoneId').value.trim();
      const token = document.getElementById('cfgToken').value.trim();

      if (!phoneId || !token) return toast('Fill in all Meta API fields', 'error');

      config = { supabaseUrl, supabaseKey, phoneId, token };
      localStorage.setItem('waCfg', JSON.stringify(config));
      initApp();
    }

    function logout() {
      if (realtimeChannel) supabaseClient.removeChannel(realtimeChannel);
      config = {}; chats = {}; activePhone = null; supabaseClient = null;
      document.getElementById('loginScreen').style.display = 'flex';
      document.getElementById('mainApp').style.display = 'none';
    }

    // ── INIT ───────────────────────────────────────────────────────────────────
    window.onload = () => {
      const saved = localStorage.getItem('waCfg');
      if (saved) {
        config = JSON.parse(saved);
        document.getElementById('cfgPhoneId').value = config.phoneId || '';
        document.getElementById('cfgToken').value = config.token || '';
        initApp();
      }
    };

    async function initApp() {
      try {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('mainApp').style.display = 'flex';

        const _sLib = window.supabase && window.supabase.createClient
          ? window.supabase
          : (typeof supabaseJs !== 'undefined' ? supabaseJs : null);

        if (!_sLib) throw new Error('Supabase library failed to load.');

        supabaseClient = _sLib.createClient(config.supabaseUrl || SUPABASE_URL, config.supabaseKey || SUPABASE_KEY);

        await loadAllMessages();
        subscribeRealtime();

      } catch (e) {
        console.error('Init error:', e);
        toast('Error: ' + e.message, 'error');
        document.getElementById('loginScreen').style.display = 'flex';
        document.getElementById('mainApp').style.display = 'none';
      }
    }

    // ── LOAD FROM SUPABASE ─────────────────────────────────────────────────────
    async function loadAllMessages() {
      const { data, error } = await supabaseClient
        .from('messages')
        .select('*')
        .order('timestamp', { ascending: true });

      if (error) return toast('DB load error: ' + error.message, 'error');

      chats = {};
      for (const msg of data) {
        addMessageToChats(msg);
      }

      renderChatList();
      updateStats();
    }

    /**
     * Core logic: group every message under the CONTACT's phone number.
     * - Received messages: contact is msg.contact_phone (the sender)
     * - Sent messages:     contact is msg.contact_phone (the recipient)
     *
     * Fallback for old DB rows that still use from_phone / to_phone:
     *   sent    → use to_phone as contact
     *   received→ use from_phone as contact
     */
    function getContactPhone(msg) {
      if (msg.contact_phone) return msg.contact_phone;
      // Fallback for legacy schema
      if (msg.direction === 'sent') return msg.to_phone || msg.from_phone;
      return msg.from_phone;
    }

    function addMessageToChats(msg) {
      const phone = getContactPhone(msg);
      if (!phone) return; // skip broken rows

      if (!chats[phone]) {
        chats[phone] = {
          name: msg.contact_name || msg.name || phone,
          phone,
          messages: [],
          unread: 0
        };
      }

      // Update contact name if we get a better one (from a received message)
      const c = chats[phone];
      const newName = msg.contact_name || msg.name;
      if (newName && newName !== phone && c.name === phone) {
        c.name = newName;
      }

      // Avoid duplicates
      if (!c.messages.find(m => m.id === msg.id)) {
        c.messages.push({
          id: msg.id,
          body: msg.body,
          direction: msg.direction,
          status: msg.status,
          timestamp: msg.timestamp
        });
        // Sort by time
        c.messages.sort((a, b) => a.timestamp - b.timestamp);
      }
    }

    // ── SUPABASE REALTIME ──────────────────────────────────────────────────────
    function subscribeRealtime() {
      setRealtimeStatus(false);

      realtimeChannel = supabaseClient
        .channel('messages-changes')
        .on('postgres_changes',
          { event: 'INSERT', schema: 'public', table: 'messages' },
          (payload) => {
            const msg = payload.new;
            const phone = getContactPhone(msg);

            addMessageToChats(msg);

            // Notify if it's an incoming message and chat isn't active
            if (msg.direction === 'received' && activePhone !== phone) {
              chats[phone].unread++;
              toast(`📩 New message from ${chats[phone].name}`);
            }

            renderChatList();
            updateStats();
            if (activePhone === phone) renderMessages(phone);
          }
        )
        .on('postgres_changes',
          { event: 'UPDATE', schema: 'public', table: 'messages' },
          (payload) => {
            const updated = payload.new;
            for (const phone of Object.keys(chats)) {
              const m = chats[phone].messages.find(m => m.id === updated.id);
              if (m) {
                m.status = updated.status;
                if (activePhone === phone) renderMessages(phone);
                renderChatList(); // update tick in preview
                break;
              }
            }
          }
        )
        .subscribe((status) => {
          setRealtimeStatus(status === 'SUBSCRIBED');
        });
    }

    function setRealtimeStatus(live) {
      document.getElementById('realtimeDot').className = 'dot' + (live ? ' live' : '');
      document.getElementById('realtimeLabel').textContent = live ? 'Realtime: live' : 'Realtime: off';
    }

    // ── SEND MESSAGE ─────────────────────────────────────────────────────────
    async function sendMessage() {
      if (!activePhone) return;
      const ta = document.getElementById('msgInput');
      const body = ta.value.trim();
      if (!body) return;

      // Check 24h window before sending
      const chat = chats[activePhone];
      const lastReceived = [...(chat?.messages || [])].reverse().find(m => m.direction === 'received');
      const windowMs = 24 * 60 * 60 * 1000;
      if (!lastReceived || (Date.now() - lastReceived.timestamp) > windowMs) {
        showWindowExpired();
        return;
      }

      const tmpId = 'tmp_' + Date.now();
      const phone = activePhone;
      const msg = { id: tmpId, body, direction: 'sent', status: 'sending', timestamp: Date.now() };

      chats[phone].messages.push(msg);
      ta.value = '';
      ta.style.height = '40px';
      renderMessages(phone);
      renderChatList();

      try {
        const res = await fetch(`https://graph.facebook.com/v21.0/${config.phoneId}/messages`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${config.token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            messaging_product: 'whatsapp',
            recipient_type: 'individual',
            to: phone.replace('+', ''),
            type: 'text',
            text: { body }
          })
        });
        const data = await res.json();

        if (data.messages?.[0]?.id) {
          const realId = data.messages[0].id;

          await supabaseClient.from('messages').upsert({
            id: realId,
            contact_phone: phone,
            contact_name: chats[phone].name !== phone ? chats[phone].name : null,
            body,
            direction: 'sent',
            status: 'sent',
            timestamp: Date.now()
          }, { onConflict: 'id' });

          const m = chats[phone].messages.find(m => m.id === tmpId);
          if (m) { m.id = realId; m.status = 'sent'; }

        } else {
          // If Meta still rejects (e.g. window just expired), handle it
          const errMsg = data.error?.message || '';
          const errCode = data.error?.code;
          const errSubCode = data.error?.error_subcode;
          const isWindowError = errCode === 131047 || errSubCode === 131047
            || errMsg.toLowerCase().includes('re-engagement')
            || errMsg.toLowerCase().includes('24');

          const idx = chats[phone].messages.findIndex(m => m.id === tmpId);
          if (idx !== -1) chats[phone].messages.splice(idx, 1);

          if (isWindowError) {
            showWindowExpired();
          } else {
            toast('Send failed: ' + (errMsg || 'Unknown error'), 'error');
          }
        }
      } catch (err) {
        console.error('Network Error:', err);
        const m = chats[phone].messages.find(m => m.id === tmpId);
        if (m) m.status = 'failed';
        toast('Network error', 'error');
      }

      renderMessages(phone);
      renderChatList();
      updateStats();
    }

    // ── 24h WINDOW EXPIRED BANNER ─────────────────────────────────────────────
    function showWindowExpired() {
      toast('24-Hour Window Expired — cannot send messages', 'error');
      // Show inline banner above the input
      const existing = document.getElementById('windowBanner');
      if (existing) return; // already showing
      const inputArea = document.querySelector('.msg-input-area');
      if (!inputArea) return;
      const banner = document.createElement('div');
      banner.id = 'windowBanner';
      banner.innerHTML = `
        <div style="background:rgba(239,68,68,0.1);border:1px solid var(--red);border-radius:8px;
          padding:10px 14px;margin:0 14px 8px;display:flex;align-items:center;gap:10px;">
          <span style="font-size:20px;">⏰</span>
          <div style="flex:1;">
            <div style="font-size:13px;font-weight:700;color:var(--red);">24-Hour Window Expired</div>
            <div style="font-size:11px;color:var(--muted);margin-top:2px;">
              The customer hasn't messaged in 24 hours. You can only reply after they send a new message.
            </div>
          </div>
        </div>`;
      inputArea.parentNode.insertBefore(banner, inputArea);
    }

    // ── RENDER CHAT LIST ───────────────────────────────────────────────────────
    function renderChatList() {
      const list = document.getElementById('chatList');
      let sorted = Object.values(chats).sort((a, b) => {
        return (b.messages.at(-1)?.timestamp || 0) - (a.messages.at(-1)?.timestamp || 0);
      });

      // Apply filter
      if (currentFilter === 'unread') {
        sorted = sorted.filter(c => c.unread > 0);
      }

      // Apply search
      if (searchQuery) {
        const q = searchQuery.toLowerCase();
        sorted = sorted.filter(c =>
          c.name.toLowerCase().includes(q) || c.phone.includes(q)
        );
      }

      if (!sorted.length) {
        list.innerHTML = `<div style="padding:20px;text-align:center;color:var(--muted);font-size:12px;">
          ${currentFilter === 'unread' ? 'No unread conversations' : 'No conversations yet'}
        </div>`;
        return;
      }

      list.innerHTML = sorted.map(chat => {
        const last = chat.messages.at(-1);
        const preview = last ? (last.direction === 'sent' ? '↑ ' : '↓ ') + last.body : '';
        const time = last ? formatTime(last.timestamp) : '';
        const initials = getInitials(chat.name);
        return `
      <div class="chat-item ${activePhone === chat.phone ? 'active' : ''}" onclick="openChat('${esc(chat.phone)}')">
        <div class="avatar">${initials}</div>
        <div class="chat-info">
          <div class="chat-name">${esc(chat.name)}</div>
          <div class="chat-preview">${esc((preview || '').substring(0, 42))}</div>
        </div>
        <div class="chat-meta">
          <div class="chat-time">${time}</div>
          ${chat.unread ? `<div class="unread-badge">${chat.unread}</div>` : ''}
        </div>
      </div>`;
      }).join('');
    }

    // ── OPEN CHAT ──────────────────────────────────────────────────────────────
    function openChat(phone) {
      activePhone = phone;
      if (chats[phone]) chats[phone].unread = 0;
      renderChatList();
      updateStats();

      const chat = chats[phone];
      const initials = getInitials(chat.name);

      document.getElementById('chatArea').innerHTML = `
    <div class="chat-header">
      <div class="avatar" style="width:34px;height:34px;font-size:13px;">${initials}</div>
      <div>
        <div class="name">${esc(chat.name)}</div>
        <div class="phone">${chat.phone}</div>
      </div>
    </div>
    <div class="msg-list" id="msgList"></div>
    <div class="msg-input-area">
      <textarea class="msg-textarea" id="msgInput" placeholder="Type a message..." rows="1"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}"
        oninput="this.style.height='40px';this.style.height=this.scrollHeight+'px'"></textarea>
      <button class="btn-send" onclick="sendMessage()">➤</button>
    </div>`;
      renderMessages(phone);

      // Proactively check if 24h window is expired
      const lastReceived = [...(chat.messages || [])].reverse().find(m => m.direction === 'received');
      const windowMs = 24 * 60 * 60 * 1000;
      if (!lastReceived || (Date.now() - lastReceived.timestamp) > windowMs) {
        showWindowExpired();
      }
    }

    // ── RENDER MESSAGES ────────────────────────────────────────────────────────
    function renderMessages(phone) {
      const list = document.getElementById('msgList');
      if (!list) return;
      const msgs = chats[phone]?.messages || [];

      const tickMap = {
        sending: '🕐', sent: '✓', delivered: '✓✓', read: '✓✓', failed: '✗'
      };

      let html = '';
      let lastDateStr = '';

      for (const msg of msgs) {
        // Date separator
        const dateStr = new Date(msg.timestamp).toDateString();
        if (dateStr !== lastDateStr) {
          lastDateStr = dateStr;
          html += `<div class="date-sep"><span>${formatDateLabel(msg.timestamp)}</span></div>`;
        }

        const tick = tickMap[msg.status] || '';
        const tickClass = msg.status === 'read' ? 'read'
          : msg.status === 'delivered' ? 'delivered'
          : msg.status === 'failed' ? 'failed'
          : 'sent';

        html += `
      <div class="msg ${msg.direction}">
        <div class="msg-bubble">${esc(msg.body)}</div>
        <div class="msg-footer">
          <span class="msg-time">${formatTime(msg.timestamp)}</span>
          ${msg.direction === 'sent' ? `<span class="tick ${tickClass}">${tick}</span>` : ''}
        </div>
      </div>`;
      }

      list.innerHTML = html;
      list.scrollTop = list.scrollHeight;
    }

    // ── NEW CHAT ───────────────────────────────────────────────────────────────
    function openNewChatModal() { document.getElementById('newChatModal').classList.add('open'); }
    function closeNewChatModal() { document.getElementById('newChatModal').classList.remove('open'); }

    function createNewChat() {
      const raw = document.getElementById('newPhone').value.trim();
      const name = document.getElementById('newName').value.trim() || raw;
      const phone = normalizePhone(raw);
      if (!phone || phone === '+') return toast('Enter a valid phone number', 'error');
      if (!chats[phone]) chats[phone] = { name, phone, messages: [], unread: 0 };
      else if (name !== raw) chats[phone].name = name; // update name
      closeNewChatModal();
      document.getElementById('newPhone').value = '';
      document.getElementById('newName').value = '';
      renderChatList();
      updateStats();
      openChat(phone);
    }

    // ── FILTER ─────────────────────────────────────────────────────────────────
    function setFilter(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderChatList();
    }

    function filterChats(v) {
      searchQuery = v;
      renderChatList();
    }

    // ── HELPERS ────────────────────────────────────────────────────────────────
    function updateStats() {
      const all = Object.values(chats);
      document.getElementById('statChats').textContent = all.length;
      document.getElementById('statSent').textContent = all.reduce((s, c) =>
        s + c.messages.filter(m => m.direction === 'sent').length, 0);
      document.getElementById('statRecv').textContent = all.reduce((s, c) =>
        s + c.messages.filter(m => m.direction === 'received').length, 0);
      document.getElementById('statUnread').textContent = all.reduce((s, c) =>
        s + (c.unread || 0), 0);
    }

    function normalizePhone(p) {
      let n = p.replace(/\D/g, '');
      if (n.startsWith('0')) n = '20' + n.substring(1);
      if (!n) return '';
      return '+' + n;
    }

    function getInitials(name) {
      if (!name || name.startsWith('+')) return '?';
      return name.split(' ').map(w => w[0]).filter(Boolean).slice(0, 2).join('').toUpperCase();
    }

    function formatTime(ts) {
      const d = new Date(ts);
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function formatDateLabel(ts) {
      const d = new Date(ts), now = new Date();
      if (d.toDateString() === now.toDateString()) return 'Today';
      const yesterday = new Date(now);
      yesterday.setDate(yesterday.getDate() - 1);
      if (d.toDateString() === yesterday.toDateString()) return 'Yesterday';
      return d.toLocaleDateString([], { day: '2-digit', month: 'short', year: 'numeric' });
    }

    function esc(str) {
      return String(str || '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>');
    }

    function toast(msg, type = 'success') {
      const t = document.getElementById('toast');
      t.textContent = msg; t.className = `show ${type}`;
      setTimeout(() => t.className = '', 3200);
    }
  </script>
</body>
